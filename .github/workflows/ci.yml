name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nomios_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet -tags integration ./...

      - name: Unit tests
        run: go test -race -count=1 ./pkg/...

      - name: Prepare MySQL for integration tests
        run: |
          mysql -h127.0.0.1 -uroot -proot <<'EOF'
          SET GLOBAL enforce_gtid_consistency = ON;
          SET GLOBAL gtid_mode = OFF_PERMISSIVE;
          SET GLOBAL gtid_mode = ON_PERMISSIVE;
          SET GLOBAL gtid_mode = ON;
          CREATE USER IF NOT EXISTS 'nomios'@'%' IDENTIFIED BY 'nomios-test';
          GRANT REPLICATION SLAVE, REPLICATION CLIENT, SELECT ON *.* TO 'nomios'@'%';
          GRANT ALL PRIVILEGES ON nomios_test.* TO 'nomios'@'%';
          FLUSH PRIVILEGES;
          EOF

      - name: Integration tests (kfake Kafka + real MySQL)
        run: go test -tags integration -race -count=1 -timeout 300s ./test/integration/...

      - name: Build
        run: go build ./...
